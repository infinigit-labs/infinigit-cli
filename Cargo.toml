[package]
name = "infinigit-cli"
version = "0.1.7"
edition = "2024"
license = "Apache-2.0"
description = "Browser-linked Internet Identity CLI for infinigit"
repository = "https://github.com/infinigit-labs/infinigit-cli"
homepage = "https://infinigit.com"
readme = "README.md"
keywords = ["git", "icp", "internet-computer", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[dependencies]
candid = "0.10"
hex = "0.4"
ic-vetkeys = "0.7"
rand = "0.8"
rpassword = "7.4"
serde = { version = "1", features = ["derive"] }
tempfile = "3.27"

[[bin]]
name = "infinigit"
path = "src/main.rs"
