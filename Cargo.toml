[package]
name = "infinigit-cli"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Browser-linked Internet Identity CLI for InfiniGit"
repository = "https://github.com/infinigit-labs/infinigit-cli"
homepage = "https://infinigit.com"
readme = "README.md"
keywords = ["git", "icp", "internet-computer", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]

[[bin]]
name = "infinigit"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.13"
